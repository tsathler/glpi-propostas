name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none
          tools: composer:v2

      - name: Validar composer.json
        run: composer validate --strict --no-check-lock

      - name: Instalar dependências de desenvolvimento
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Sintaxe de todos os arquivos PHP
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Testes (PHPUnit)
        run: vendor/bin/phpunit

  conferencias:
    name: Conferências do repositório
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sem CRLF nos arquivos de texto
        run: |
          if git ls-files --eol | grep -E '^i/(crlf|mixed)'; then
            echo "Há arquivos com CRLF (veja acima)."; exit 1
          fi

      - name: Versão igual no setup.php e no CHANGELOG
        run: |
          versao=$(grep -oP "PLUGIN_PROPOSTAS_VERSION', '\K[^']+" setup.php)
          echo "setup.php: $versao"
          if ! grep -qE "^## \[(Unreleased|${versao//./\\.})\]" CHANGELOG.md; then
            echo "CHANGELOG.md não tem seção [Unreleased] nem [$versao]."; exit 1
          fi

      - name: Zip da release só com arquivos do plugin
        run: |
          git archive --format=tar --prefix=propostas/ HEAD | tar -t > conteudo.txt
          if grep -E '^propostas/(tests|\.github|docs|phpunit\.xml\.dist)' conteudo.txt; then
            echo "Arquivos de desenvolvimento entrariam no zip (veja acima)."; exit 1
          fi
          grep -q '^propostas/setup.php$' conteudo.txt
